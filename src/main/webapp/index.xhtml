<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Clinic Patient &amp; Appointment System</title>
    <h:outputStylesheet library="css" name="style.css"/>
    <!-- INTERNAL CSS  -->
    <style type="text/css">
        .home-card {
            display: inline-block;
            width: 260px;
            margin: 15px;
            padding: 25px;
            text-align: center;
            border: 1px solid #dfe6e9;
            border-radius: 8px;
        }
        .home-card h2 { color: #146c94; }
        .home-card a { color: #146c94; font-weight: bold; text-decoration: none; }
    </style>
</h:head>
<h:body>
    <div class="clinic-header">
        <h1>🏥 Clinic Patient &amp; Appointment System</h1>
    </div>
    <!-- INLINE CSS  -->
    <div class="clinic-container" style="text-align:center; padding-top:35px; padding-bottom:35px;">
        <h:panelGroup layout="block" styleClass="home-card">
            <h2>Patients</h2>
            <p>Register, view, update and remove patient records.</p>
            <h:link outcome="/patients/list" value="Manage Patients"/>
        </h:panelGroup>

        <h:panelGroup layout="block" styleClass="home-card">
            <h2>Appointments</h2>
            <p>Book, view, update and cancel appointments.</p>
            <h:link outcome="/appointments/list" value="Manage Appointments"/>
        </h:panelGroup>
    </div>
</h:body>
</html>
