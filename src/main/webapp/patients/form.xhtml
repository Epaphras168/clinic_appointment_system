<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core">
<h:head>
    <title>Patient Form</title>
    <h:outputStylesheet library="css" name="style.css"/>
    <!-- INTERNAL CSS  -->
    <style type="text/css">
        .form-box { max-width: 520px; margin: 0 auto; }
        .required-star { color: #d64545; margin-left: 3px; }
    </style>
    <!-- CLIENT-SIDE JAVASCRIPT VALIDATION  -->
    <script type="text/javascript">
        function validatePatientForm() {
            var phone = document.getElementById('patientForm:phone').value;
            var phonePattern = /^(\+250|0)7[0-9]{8}$/;
            if (!phonePattern.test(phone)) {
                alert('Please enter a valid Rwandan phone number (e.g. 0788123456) before submitting.');
                return false;
            }
            return true;
        }
    </script>
</h:head>
<h:body>
    <div class="clinic-header">
        <h1>#{patientBean.editMode ? 'Update Patient' : 'Register Patient'}</h1>
        <div class="nav-links"><h:link outcome="/patients/list" value="Back to List"/></div>
    </div>

    <div class="clinic-container">
        <!-- INLINE CSS (CSS type 3) applied directly on this container -->
        <h:form id="patientForm" style="max-width:520px; margin:0 auto;" onsubmit="return validatePatientForm();">

            <h:messages globalOnly="true" layout="table" style="color:#d64545; margin-bottom:10px;"/>

            <h:inputHidden value="#{patientBean.patient.patientId}"/>

            <div class="form-row">
                <label for="patientForm:firstName">First Name <span class="required-star">*</span></label>
                <!-- JSF built-in validation (type #2): required + validateLength -->
                <h:inputText id="firstName" styleClass="form-input" required="true"
                             requiredMessage="First name is required"
                             value="#{patientBean.patient.firstName}">
                    <f:validateLength minimum="2" maximum="50"/>
                </h:inputText>
                <h:message for="firstName" styleClass="error-text"/>
            </div>

            <div class="form-row">
                <label for="patientForm:lastName">Last Name <span class="required-star">*</span></label>
                <h:inputText id="lastName" styleClass="form-input" required="true"
                             requiredMessage="Last name is required"
                             value="#{patientBean.patient.lastName}">
                    <f:validateLength minimum="2" maximum="50"/>
                </h:inputText>
                <h:message for="lastName" styleClass="error-text"/>
            </div>

            <div class="form-row">
                <label for="patientForm:dob">Date of Birth <span class="required-star">*</span></label>
                <!-- Custom JSF validator method bound from the bean (type #2) -->
                <h:inputText id="dob" styleClass="form-input" required="true"
                             requiredMessage="Date of birth is required"
                             value="#{patientBean.patient.dateOfBirth}"
                             validator="#{patientBean.validateDateOfBirth}">
                    <f:convertDateTime pattern="yyyy-MM-dd" type="localDate"/>
                </h:inputText>
                <h:message for="dob" styleClass="error-text"/>
                <small>Format: yyyy-MM-dd</small>
            </div>

            <div class="form-row">
                <label for="patientForm:gender">Gender <span class="required-star">*</span></label>
                <h:selectOneMenu id="gender" styleClass="form-input" required="true"
                                 requiredMessage="Please select a gender"
                                 value="#{patientBean.patient.gender}">
                    <f:selectItem itemLabel="-- Select --" itemValue=""/>
                    <f:selectItem itemLabel="Male" itemValue="Male"/>
                    <f:selectItem itemLabel="Female" itemValue="Female"/>
                    <f:selectItem itemLabel="Other" itemValue="Other"/>
                </h:selectOneMenu>
                <h:message for="gender" styleClass="error-text"/>
            </div>

            <div class="form-row">
                <label for="patientForm:phone">Phone <span class="required-star">*</span></label>
                <h:inputText id="phone" styleClass="form-input" required="true"
                             requiredMessage="Phone number is required"
                             value="#{patientBean.patient.phone}"
                             style="border:1px solid #c8d2d8;">
                    <f:validateRegex pattern="^(\+250|0)7[0-9]{8}$"/>
                </h:inputText>
                <h:message for="phone" styleClass="error-text"/>
            </div>

            <div class="form-row">
                <label for="patientForm:email">Email</label>
                <h:inputText id="email" styleClass="form-input" value="#{patientBean.patient.email}">
                    <f:validateRegex pattern="^$|^[\w.-]+@[\w.-]+\.[a-zA-Z]{2,}$"/>
                </h:inputText>
                <h:message for="email" styleClass="error-text"/>
            </div>

            <div class="form-row">
                <label for="patientForm:address">Address <span class="required-star">*</span></label>
                <h:inputText id="address" styleClass="form-input" required="true"
                             requiredMessage="Address is required"
                             value="#{patientBean.patient.address}">
                    <f:validateLength maximum="150"/>
                </h:inputText>
                <h:message for="address" styleClass="error-text"/>
            </div>

            <h:commandButton value="Save Patient" action="#{patientBean.save}" styleClass="btn btn-primary"/>
            <h:link outcome="/patients/list" value="Cancel" styleClass="btn btn-secondary"/>
        </h:form>
    </div>
</h:body>
</html>
