spring:
  application:
    name: clinic-api

  # --- PostgreSQL (active) ---
  datasource:
    url: jdbc:postgresql://localhost:5432/clinicdb
    driver-class-name: org.postgresql.Driver
    username: postgres
    password: password
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # --- H2 in-memory alternative (uncomment and comment out the Postgres block above) ---
  # datasource:
  #   url: jdbc:h2:mem:clinicdb;DB_CLOSE_DELAY=-1
  #   driver-class-name: org.h2.Driver
  #   username: sa
  #   password: ""
  # h2:
  #   console:
  #     enabled: true
  #     path: /h2-console
  # jpa:
  #   database-platform: org.hibernate.dialect.H2Dialect
  #   hibernate:
  #     ddl-auto: update
  #   show-sql: true

server:
  port: 8080
